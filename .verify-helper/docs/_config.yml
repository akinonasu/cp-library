title: cp-library
description: 競技プログラミング用 C++ ライブラリ
url: https://qandori.github.io
baseurl: /cp-library
repository: qandori/cp-library
lang: ja
advanced_directory: data_structure/advanced
main_libraries:
  - components/bitwise_zeta.hpp
  - components/divisor_zeta.hpp
  - components/walsh_hadamard.hpp
  - components/fft.hpp
  - components/ntt_mod.hpp
  - components/ntt.hpp
implementation_variants:
  fps/fps.hpp: fps/fps_light.hpp
  fps/taylor_shift.hpp: fps/fps_light_algorithms.hpp
  fps/bostan_mori.hpp: fps/fps_light_algorithms.hpp
  fps/linear_recurrence.hpp: fps/fps_light_algorithms.hpp
  fps/multipoint_eval.hpp: fps/fps_light_algorithms.hpp
  fps/interpolate.hpp: fps/fps_light_algorithms.hpp
  components/fps_backend.hpp: components/fps_light_backend.hpp
  components/ntt.hpp: components/fps_light_ntt.hpp
  components/fps_product_tree.hpp: components/fps_light_product_tree.hpp
implementation_variant_apis:
  fps/taylor_shift.hpp: light_fps_algorithms::taylor_shift
  fps/bostan_mori.hpp: light_fps_algorithms::bostan_mori
  fps/linear_recurrence.hpp: light_fps_algorithms::linear_recurrence
  fps/multipoint_eval.hpp: light_fps_algorithms::multipoint_eval
  fps/interpolate.hpp: light_fps_algorithms::interpolate
kramdown:
  math_engine: mathjax
exclude:
  - README.md
  - AGENTS.md
  - test/unit
  - test/benchmark
  - test/verify.py
  - test/verify_edit_distance_simd.py
