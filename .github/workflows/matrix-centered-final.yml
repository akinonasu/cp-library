name: Matrix centered finalist

on:
  push:
    branches: [codex/matrix-centered-20261018]
    paths:
      - components/matrix_arithmetic.hpp
      - math/linear_algebra/matrix.hpp
      - math/mint.hpp
      - test/benchmark/matrix.cpp
      - test/benchmark/matrix.py
      - .github/workflows/matrix-centered-final.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fixed GCC 15.2 comparison
        timeout-minutes: 8
        run: >-
          python3 -B test/benchmark/matrix.py
          --base-ref 36e2dcc732f89d7b0b3c4e47cb95155f5a41893d
          --candidate-ref "$GITHUB_SHA"
