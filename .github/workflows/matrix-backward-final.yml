name: Matrix backward finalist

on:
  push:
    branches: [codex/matrix-backward-20261018]
    paths:
      - components/matrix_arithmetic.hpp
      - math/matrix.hpp
      - math/mint.hpp
      - test/benchmark/matrix.cpp
      - test/benchmark/matrix.py
      - .github/workflows/matrix-backward-final.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fixed GCC 15.2 comparison
        timeout-minutes: 8
        run: >-
          python3 -B test/benchmark/matrix.py
          --base-ref 8d0babd9e56d88ea1ff332ded0c6b60f76680444
          --candidate-ref "$GITHUB_SHA"
          --comparison-scope backward
