name: Dynamic wavelet matrix finalist

on:
  push:
    branches: [codex/dwm-avx-update-20261018]
    paths:
      - components/dynamic_bit_vector.hpp
      - data_structure/dynamic_wavelet_matrix.hpp
      - test/benchmark/dwm_avx_final/*.cpp
      - test/benchmark/dwm_avx_final/run.py

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fixed GCC 15.2 comparison
        timeout-minutes: 18
        run: >-
          python3 test/benchmark/dwm_avx_final/run.py
          --repo "$GITHUB_WORKSPACE"
          --candidate-sha "$GITHUB_SHA"
