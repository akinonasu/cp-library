name: Edit distance trimming finalist

on:
  push:
    branches: [codex/edit-distance-trim-20261018]
    paths:
      - string/edit_distance.hpp
      - test/benchmark/edit_distance_trim.cpp
      - test/benchmark/edit_distance_trim_call.cpp
      - test/benchmark/edit_distance.py
      - .github/workflows/edit-distance-trim-final.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fixed GCC 15.2 comparison
        timeout-minutes: 8
        run: >-
          python3 -B test/benchmark/edit_distance.py
          --base-ref bce99d05caeea138a0598eab170f1110c1c6f786
          --candidate-ref "$GITHUB_SHA"
