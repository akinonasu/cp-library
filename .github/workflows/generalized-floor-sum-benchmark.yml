name: generalized floor sum benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run performance comparisons
        type: boolean
        default: true
      verify:
        description: Run current header, sanitizer and official tests
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record environment
        run: |
          mkdir -p benchmark-results
          { uname -a; lscpu; g++ --version; } > benchmark-results/environment.txt
          cat benchmark-results/environment.txt
      - name: Benchmark GCC
        if: inputs.benchmark
        run: |
          python3 test/benchmark/generalized_floor_sum_variants.py /tmp/floor-variants
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -I . -I test/benchmark -I /tmp/floor-variants test/benchmark/generalized_floor_sum.cpp -o /tmp/floor-bench
          /tmp/floor-bench 20000 5 > benchmark-results/assertions.csv
          g++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -Werror -I . -I test/benchmark -I /tmp/floor-variants test/benchmark/generalized_floor_sum.cpp -o /tmp/floor-bench
          /tmp/floor-bench 20000 5 > benchmark-results/release.csv
      - name: Check current header with GCC and Clang
        if: inputs.verify
        run: |
          python3 test/benchmark/verify_selected.py math/floor_sum/generalized_floor_sum.hpp test/unit/generalized_floor_sum.cpp
      - name: Verify yukicoder No.2362
        if: inputs.verify
        env:
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
        run: |
          python3 -m pip install -r test/requirements.txt
          oj-verify run --timeout 1200 --tle 2 -j 2 test/generalized_floor_sum.test.cpp > benchmark-results/judge.log 2>&1
          tail -n 25 benchmark-results/judge.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generalized-floor-sum-linux-gcc-benchmark
          path: benchmark-results
