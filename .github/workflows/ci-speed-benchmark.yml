name: CI speed benchmark
on:
  workflow_dispatch:
    inputs:
      check_helpers:
        description: Check changed helper scripts
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r test/requirements.txt
      - name: Check CI helpers
        if: inputs.check_helpers
        run: python -m unittest discover -s .verify-helper -p '*_test.py'
      - name: Select two drivers sharing one problem
        run: |
          mkdir -p benchmark-results
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '.verify-helper')
          from ci import ROOT, build_plan, invalidate_selected, write_json
          plan = build_plan(ROOT, environment='ci-speed-benchmark')
          for group in ('headers', 'unit', 'sanitize', 'bundles'):
              plan[group] = []
          plan['verification'] = ['test/auxiliary_tree.test.cpp', 'test/lowest_common_ancestor.test.cpp']
          plan['state']['targets']['verification'] = {name: plan['state']['targets']['verification'][name] for name in plan['verification']}
          write_json(Path('.verify-helper/selection.json'), plan)
          write_json(Path('.verify-helper/verified-state.json'), invalidate_selected(None, plan))
          PY
      - name: Prepare selected caches
        id: judge-data
        run: python .verify-helper/judge_data.py
      - name: Install cache client
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .verify-helper/cache-tool
      - name: Restore selected data
        uses: ./.verify-helper
        with:
          operation: restore
          manifest: .verify-helper/judge-cache.json
      - name: Check changed data preparation
        if: ${{ !inputs.check_helpers }}
        run: python -m unittest discover -s .verify-helper -p 'judge_data_test.py'
      - name: Verify two drivers
        run: python test/benchmark/ci_speed.py > benchmark-results/judge.log 2>&1
      - name: Save selected data
        if: always()
        uses: ./.verify-helper
        with:
          operation: save
          manifest: .verify-helper/judge-cache.json
      - name: Confirm successful tests are reused
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '.verify-helper')
          from ci import ROOT, build_plan
          state = json.loads(Path('.verify-helper/verified-state.json').read_text())
          retry = build_plan(ROOT, state, environment='ci-speed-benchmark')
          for name in ('test/auxiliary_tree.test.cpp', 'test/lowest_common_ancestor.test.cpp'):
              assert name not in retry['verification'], name
          Path('benchmark-results/cache.json').write_text(Path('.verify-helper/judge-cache.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-speed-results
          path: benchmark-results
