name: Matrix packed finalist

on:
  push:
    branches: [codex/matrix-packed-20261018]
    paths:
      - components/matrix_arithmetic.hpp
      - math/matrix.hpp
      - math/mint.hpp
      - test/benchmark/matrix.cpp
      - test/benchmark/matrix.py
      - .github/workflows/matrix-packed-final.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fixed GCC 15.2 comparison
        timeout-minutes: 8
        run: >-
          python3 -B test/benchmark/matrix.py
          --base-ref 056f9f366f0d1aed0401b5845b9294b61b33c926
          --candidate-ref "$GITHUB_SHA"
