name: retroactive priority queue benchmark

on:
  workflow_dispatch:
    inputs:
      check_forward:
        description: Check changed forward-scan candidate
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record environment
        run: |
          mkdir -p benchmark-results
          { uname -a; lscpu; g++ --version; } > benchmark-results/environment.txt
      - name: Prepare comparison
        run: python3 test/benchmark/retroactive_priority_queue_variants.py /tmp/retro-pq-variants
      - name: Check forward-scan candidate
        if: inputs.check_forward
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -I . -I /tmp/retro-pq-variants /tmp/retro-pq-variants/forward_test.cpp -o /tmp/retro-pq-unit
          /tmp/retro-pq-unit
      - name: Benchmark GCC
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -I . -I /tmp/retro-pq-variants test/benchmark/retroactive_priority_queue.cpp -o /tmp/retro-pq-bench
          /tmp/retro-pq-bench 100000 5000 5 > benchmark-results/assertions.csv
          g++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -Werror -I . -I /tmp/retro-pq-variants test/benchmark/retroactive_priority_queue.cpp -o /tmp/retro-pq-bench
          /tmp/retro-pq-bench 100000 5000 5 > benchmark-results/release.csv
      - name: Check current library
        run: python3 test/benchmark/verify_selected.py data_structure/retroactive_priority_queue.hpp test/unit/retroactive_priority_queue.cpp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retroactive-priority-queue-linux-gcc-benchmark
          path: benchmark-results
